<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>DarkShield AI</title>
</head>
<body>
  <div class="hud-container">
    <div class="hud-header">
      <div class="hud-brand">
        <span>🛡️</span>
        <strong>DarkShield AI</strong>
      </div>
      <span class="badge active">PROTECTING</span>
    </div>

    <div class="hud-stat-box">
      <div class="stat-number" id="threat-count">0</div>
      <div class="stat-label">DECEPTIVE PATTERNS BLOCKED</div>
    </div>

    <div class="actions-list">
      <button id="btn-freeze-timers" class="hud-btn">
        <span>⏱️</span> Freeze Fake Urgency Timers
      </button>
      <button id="btn-untick-addons" class="hud-btn">
        <span>🛒</span> Untick Sneaked Fees (+₹49)
      </button>
      <button id="btn-open-dashboard" class="hud-btn primary">
        <span>⚡</span> Open DarkShield Full Dashboard
      </button>
    </div>

    <div class="hud-footer">
      <span>CCPA 2023 Dark Pattern Enforcement</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
