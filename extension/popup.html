<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <title>DarkShield AI Prototype</title>
</head>
<body>
  <div class="hud-container">
    <div class="hud-header">
      <div class="hud-brand">
        <span class="hud-logo">🛡️</span>
        <div>
          <strong class="hud-title">DarkShield AI</strong>
          <div class="hud-badge">PROTOTYPE</div>
        </div>
      </div>
      <span id="hud-mode-pill" class="badge-mode">HIGHLIGHT ONLY</span>
    </div>

    <!-- Auto-fix Toggle Card -->
    <div class="toggle-card">
      <div class="toggle-row">
        <label for="toggle-autofix" class="toggle-label-text">
          <span class="toggle-title">Auto-fix (untick fees, freeze timers)</span>
          <span class="toggle-sub">Default OFF. When enabled, auto-remedies threats.</span>
        </label>
        <label class="switch">
          <input type="checkbox" id="toggle-autofix">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Threat Stat -->
    <div class="hud-stat-box">
      <div class="stat-number" id="threat-count">0</div>
      <div class="stat-label">DECEPTIVE PATTERNS FLAGGED</div>
    </div>

    <!-- Live Page Scanner -->
    <div class="scan-section">
      <button id="btn-scan-page" class="hud-btn scan-btn" type="button">
        <span class="scan-btn-icon">🔍</span>
        <span id="scan-btn-text">Scan This Page</span>
      </button>
      <div id="scan-feedback" class="scan-feedback" style="display: none;"></div>
    </div>

    <!-- Live Scan Results Container -->
    <div id="scan-results-container" class="scan-results-box" style="display: none;">
      <div class="scan-results-header">
        <div class="scan-score-wrap">
          <span class="scan-score-label">DECEPTION SCORE</span>
          <div class="scan-score-val">
            <span id="scan-score-num">0</span><span class="scan-score-max">/100</span>
          </div>
        </div>
        <div id="scan-risk-badge" class="scan-risk-pill">NO DARK PATTERNS</div>
      </div>
      <!-- On-Page Jump Navigation Toolbar -->
      <div id="scan-nav-bar" class="scan-nav-bar" style="display: none;">
        <button id="btn-show-all" class="hud-btn-mini" type="button" title="Scroll to first item on page">🎯 Show all</button>
        <div class="scan-nav-arrows">
          <button id="btn-prev-finding" class="hud-btn-mini" type="button" aria-label="Previous finding on page">◀ Prev</button>
          <button id="btn-next-finding" class="hud-btn-mini" type="button" aria-label="Next finding on page">Next ▶</button>
        </div>
      </div>
      <div id="scan-findings-list" class="scan-findings-list"></div>
    </div>

    <!-- Manual Quick Actions -->
    <div class="actions-list">
      <button id="btn-freeze-timers" class="hud-btn" type="button">
        <span>⏱️</span> Freeze Fake Urgency Timers
      </button>
      <button id="btn-untick-addons" class="hud-btn" type="button">
        <span>🛒</span> Untick Sneaked Fees (+₹49)
      </button>
      <button id="btn-open-dashboard" class="hud-btn primary" type="button">
        <span>⚡</span> Open Full DarkShield Suite
      </button>
      <div id="action-status" class="action-status" style="display: none;"></div>
    </div>

    <div class="hud-footer">
      <div class="privacy-note">🔒 Runs entirely on your device. No data is collected or sent.</div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
